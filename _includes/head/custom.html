{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->

<style>
	/* Project excerpt paragraphs and their media */
	.archive__item-excerpt {
		font-size: inherit;
	}

	/* Make images/videos in project excerpts smaller consistently */
	.archive__item-excerpt img,
	.archive__item-excerpt video,
	p.archive__item-excerpt img,
	p.archive__item-excerpt video {
		width: 220px !important;
		max-width: 220px !important;
		min-width: auto !important;
		height: auto !important;
		display: block !important;
		margin: 0.5rem auto !important;
	}

	/* If multiple media sit inline, add spacing */
	.archive__item-excerpt img + img,
	.archive__item-excerpt video + video,
	.archive__item-excerpt img + video,
	.archive__item-excerpt video + img {
		margin-top: 0.5rem !important;
	}

	/* Project titles: remove link-like hover effect when not links */
	.archive__item-title {
		cursor: default;
		text-decoration: none !important;
	}
	.archive__item-title:hover {
		text-decoration: none !important;
	}
	.archive__item-title a {
		text-decoration: none !important;
	}
	.archive__item-title a:hover {
		text-decoration: none !important;
	}
		text-decoration: none;
	}
</style>
